<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dev Cycle — Phase Duration Breakdown</title>
<style>
:root{
  --dc-ink:var(--foreground,#162235);
  --dc-muted:var(--muted-foreground,#586982);
  --dc-border:var(--border,#d7e0ec);
  --dc-pole:var(--destructive,#dc2626);
  --dc-pole-bg:var(--destructive-surface,rgba(220,38,38,.10));
}
@media (prefers-color-scheme: dark){
  :root{
    --dc-ink:var(--foreground,#e8eef7);
    --dc-muted:var(--muted-foreground,#98a7be);
    --dc-border:var(--border,#2b384d);
    --dc-pole:var(--destructive,#f87171);
    --dc-pole-bg:var(--destructive-surface,rgba(248,113,113,.13));
  }
}
*{box-sizing:border-box}
body{margin:0;color:var(--dc-ink);font:13px/1.45 var(--font-sans,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif)}
h1{margin:0 0 2px;font-size:15px;font-weight:650}
.sub{margin:0 0 10px;font-size:12px;color:var(--dc-muted)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 9px;border-bottom:1px solid var(--dc-border);text-align:left;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--dc-muted)}
td.num,th.num{text-align:right}
tr.long-pole{background:var(--dc-pole-bg);box-shadow:inset 3px 0 0 var(--dc-pole)}
tr.long-pole td{font-weight:700}
tr.long-pole td.phase,tr.long-pole td.share{color:var(--dc-pole)}
.empty{padding:16px 0;color:var(--dc-muted)}
</style>
</head>
<body>
  <h1 id="title">Phase Duration Breakdown (Empirical Scope Reference)</h1>
  <p class="sub" id="subtitle"></p>
  <div id="table-host"></div>
  <script id="cycle-data" type="application/json">__CYCLE_DATA_JSON__</script>
  <script>
  (function(){
    const data = JSON.parse(document.getElementById('cycle-data').textContent);

    function fmtDur(sec){
      if (sec == null || !Number.isFinite(sec)) return '—';
      const s = Math.max(0, sec);
      if (s < 60) return s < 10 ? s.toFixed(1) + 's' : Math.round(s) + 's';
      if (s < 3600){
        const m = Math.floor(s / 60), r = Math.round(s % 60);
        return r ? m + 'm ' + r + 's' : m + 'm';
      }
      const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
      return m ? h + 'h ' + m + 'm' : h + 'h';
    }

    function fmtPct(v){
      return (v == null || !Number.isFinite(v)) ? '—' : (v * 100).toFixed(1) + '%';
    }

    function esc(str){
      return String(str == null ? '' : str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.title = data.title || 'Phase Duration Breakdown';
    document.getElementById('title').textContent = data.title || 'Phase Duration Breakdown (Empirical Scope Reference)';

    const sum = data.summary || {};
    const ref = data.scope_reference || {};
    document.getElementById('subtitle').textContent = data.mode === 'single'
      ? 'Wall clock ' + fmtDur(sum.wall_clock_seconds) + ' · ' + (sum.span_count || 0) + ' spans · ' + (sum.failed_spans || 0) + ' failed · Long poles highlighted'
      : (sum.items_count || 0) + ' items · first-pass p50 ' + fmtDur(ref.first_pass_p50_seconds) +
        ' · failure-adjusted p50 ' + fmtDur(ref.failure_adjusted_p50_seconds) +
        ' (' + fmtPct(sum.failure_rate) + ' failure rate) · Long poles highlighted';

    const phases = data.phase_stats || [];
    const host = document.getElementById('table-host');
    if (!phases.length){
      host.innerHTML = '<div class="empty">No timing spans recorded.</div>';
      return;
    }

    if (data.mode === 'single'){
      host.innerHTML =
        '<table><thead><tr><th>Phase</th><th>Kind</th><th class="num">Count</th><th class="num">Duration</th><th class="num">Share</th></tr></thead><tbody>' +
        phases.map((p, i) => {
          const pole = p.long_pole === true || (p.long_pole == null && (i === 0 || (i < 3 && p.share >= 0.10)));
          return '<tr class="' + (pole ? 'long-pole' : '') + '">' +
            '<td class="phase">' + esc(p.phase) + '</td>' +
            '<td>' + esc(p.kind) + '</td>' +
            '<td class="num">' + p.count + '</td>' +
            '<td class="num">' + esc(fmtDur(p.total_seconds)) + '</td>' +
            '<td class="num share">' + esc(fmtPct(p.share)) + '</td>' +
            '</tr>';
        }).join('') + '</tbody></table>';
    } else {
      host.innerHTML =
        '<table><thead><tr><th>Phase</th><th>Kind</th><th class="num">Count</th><th class="num">p50</th><th class="num">p75</th><th class="num">p90</th><th class="num">Mean</th><th class="num">Share</th></tr></thead><tbody>' +
        phases.map((p, i) => {
          const pole = p.long_pole === true || (p.long_pole == null && (i === 0 || (i < 3 && p.share >= 0.10)));
          return '<tr class="' + (pole ? 'long-pole' : '') + '">' +
            '<td class="phase">' + esc(p.phase) + '</td>' +
            '<td>' + esc(p.kind) + '</td>' +
            '<td class="num">' + p.count + '</td>' +
            '<td class="num">' + esc(fmtDur(p.p50_seconds)) + '</td>' +
            '<td class="num">' + esc(fmtDur(p.p75_seconds)) + '</td>' +
            '<td class="num">' + esc(fmtDur(p.p90_seconds)) + '</td>' +
            '<td class="num">' + esc(fmtDur(p.mean_seconds)) + '</td>' +
            '<td class="num share">' + esc(fmtPct(p.share)) + '</td>' +
            '</tr>';
        }).join('') + '</tbody></table>';
    }
  })();
  </script>
</body>
</html>
